<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oração Ininterrupta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-white min-h-screen font-sans text-slate-800">

<!-- Header -->
<header class="border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-indigo-950 hover:text-indigo-700 text-2xl transition">
                <i class="fa-solid fa-house"></i>
            </a>
        </div>
        <span class="font-semibold text-lg text-indigo-950">Oração Ininterrupta</span>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-4xl mx-auto px-4 py-8">

    <!-- Formulário de Criação -->
    <div id="secao-criacao" class="hidden mb-12 max-w-xl ml-auto bg-slate-50 p-6 rounded-2xl border border-slate-100 shadow-sm">
        <h2 class="text-indigo-950 font-bold text-base mb-4">Nova Escala de Oração</h2>
        <form id="form-escala" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-indigo-950 uppercase tracking-wide mb-1">Igreja</label>
                <input type="text" id="igreja" required placeholder="Ex: ICM HINTERLÂNDIA" class="w-full border-b border-slate-300 focus:border-indigo-950 outline-none py-1.5 text-slate-800 bg-transparent text-sm transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-indigo-950 uppercase tracking-wide mb-1">Motivo</label>
                <input type="text" id="motivo" required placeholder="Ex: ORAÇÃO CONTÍNUA PELAS ELEIÇÕES" class="w-full border-b border-slate-300 focus:border-indigo-950 outline-none py-1.5 text-slate-800 bg-transparent text-sm transition">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-indigo-950 uppercase tracking-wide mb-1">Início</label>
                    <input type="date" id="data-inicio" required class="w-full border-b border-slate-300 focus:border-indigo-950 outline-none py-1.5 text-slate-600 bg-transparent text-sm transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-indigo-950 uppercase tracking-wide mb-1">Término</label>
                    <input type="date" id="data-fim" required class="w-full border-b border-slate-300 focus:border-indigo-950 outline-none py-1.5 text-slate-600 bg-transparent text-sm transition">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-indigo-950 uppercase tracking-wide mb-1">Intervalo dos Horários</label>
                <select id="intervalo-tempo" class="w-full border-b border-slate-300 focus:border-indigo-950 outline-none py-1.5 text-slate-800 bg-transparent text-sm transition">
                    <option value="15">15 em 15 minutos (96 horários por dia)</option>
                    <option value="20">20 em 20 minutos (72 horários por dia)</option>
                </select>
            </div>
            <div class="flex justify-end gap-3 pt-3">
                <button type="button" onclick="esconderFormulario()" class="px-5 py-2 rounded-full border border-indigo-950 text-indigo-950 font-medium text-xs hover:bg-slate-100 transition">Cancelar</button>
                <button type="submit" class="px-7 py-2 rounded-full bg-[#0b132b] text-white font-medium text-xs hover:bg-indigo-900 transition shadow-sm">OK</button>
            </div>
        </form>
    </div>

    <!-- Botão para acionar Nova Escala -->
    <div id="secao-botao-nova" class="flex justify-end mb-10">
        <button onclick="mostrarFormulario()" class="bg-[#0b132b] hover:bg-indigo-950 text-white px-6 py-2.5 rounded-full font-medium text-sm shadow-sm transition flex items-center gap-2">
            <i class="fa-solid fa-plus text-xs"></i> Nova escala
        </button>
    </div>

    <!-- Título da Seção -->
    <div class="mb-4">
        <h2 class="text-sm font-bold text-indigo-950 tracking-wide uppercase">Minhas escalas</h2>
    </div>

    <!-- Lista de Escalas -->
    <div id="lista-escalas" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Renderizado dinamicamente via JS -->
    </div>

    <!-- Estado Vazio -->
    <div id="estado-vazio" class="border-2 border-dashed border-indigo-950/20 rounded-2xl p-12 text-center max-w-lg mx-auto bg-slate-50/50 shadow-sm mt-4">
        <h3 class="text-indigo-950 font-bold text-base mb-1">Suas escalas irão aparecer aqui</h3>
        <p class="text-slate-500 text-sm">Crie uma escala para começar.</p>
    </div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
